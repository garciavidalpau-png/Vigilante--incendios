name: Vigilante incendios León

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede retrasarlo algo)
  workflow_dispatch:          # permite lanzarlo a mano desde la web

permissions:
  contents: write

concurrency:
  group: vigilante-incendios
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar vigilante
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Guardar estado (noticias ya vistas)
        run: |
          git config user.name "fire-bot"
          git config user.email "fire-bot@users.noreply.github.com"
          git add seen.json
          git commit -m "Actualizar estado" || echo "Sin cambios que guardar"
          git push
